services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # git itself (php-git), as services: reading a repository's history, and
    # committing given paths as whoever runs PHP — an application running git
    # as someone else aliases the process factory to its own.
    Wexample\PhpGit\Class\GitRepositoryReader: ~

    Wexample\PhpGit\Class\GitProcessFactory: ~

    Wexample\PhpGit\Interface\GitProcessFactoryInterface: '@Wexample\PhpGit\Class\GitProcessFactory'

    Wexample\PhpGit\Class\GitCommitter: ~

    Wexample\SymfonyGit\Service\:
        resource: '../../Service'

    # The repositories the API serves: those the application declared
    # (`wexample_symfony_git.repositories`), unless it aliases the resolver to
    # its own.
    Wexample\SymfonyGit\Service\ConfiguredGitRepositoryResolver:
        arguments:
            $repositories: '%wexample_symfony_git.repositories%'

    Wexample\SymfonyGit\Interface\GitRepositoryResolverInterface: '@Wexample\SymfonyGit\Service\ConfiguredGitRepositoryResolver'

    Wexample\SymfonyGit\Api\Controller\:
        resource: '../../Api/Controller/*'
        tags: ['controller.service_arguments']

    Wexample\SymfonyGit\Api\Normalizer\:
        resource: '../../Api/Normalizer/*'
        tags: ['serializer.normalizer']
